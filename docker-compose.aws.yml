services:
  ms-usuarios:
    build: ./ms-usuarios
    env_file: .env.aws
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://${RDS_HOST}:${RDS_PORT}/sanosysalvos_usuarios"
      SPRING_DATASOURCE_USERNAME: "${RDS_USER}"
      SPRING_DATASOURCE_PASSWORD: "${RDS_PASSWORD}"
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.2-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD}"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    expose:
      - "2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    depends_on:
      - kafka
    ports:
      - "8092:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: sanosysalvos-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    restart: unless-stopped

  ms-mascotas:
    build: ./ms-mascotas
    env_file: .env.aws
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://${RDS_HOST}:${RDS_PORT}/sanosysalvos_mascotas"
      SPRING_DATASOURCE_USERNAME: "${RDS_USER}"
      SPRING_DATASOURCE_PASSWORD: "${RDS_PASSWORD}"
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: "${RABBITMQ_USER}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD}"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      rabbitmq:
        condition: service_healthy  
      kafka:
        condition: service_started
    restart: unless-stopped

  ms-rabbitmq-admin:
    build: ./ms-rabbitmq-admin
    env_file: .env.aws
    environment:
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: "${RABBITMQ_USER}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD}"
      RABBITMQ_MANAGEMENT_BASE_URL: "http://rabbitmq:15672"
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  ms-geolocalizacion:
    build: ./ms-geolocalizacion
    env_file: .env.aws
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://${RDS_HOST}:${RDS_PORT}/sanosysalvos_geolocalizacion"
      SPRING_DATASOURCE_USERNAME: "${RDS_USER}"
      SPRING_DATASOURCE_PASSWORD: "${RDS_PASSWORD}"
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
    restart: unless-stopped

  ms-coincidencias:
    build: ./ms-coincidencias
    environment:
      MS_MASCOTAS_URL: "http://ms-mascotas:8082"
      MS_GEOLOCALIZACION_URL: "http://ms-geolocalizacion:8084"
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      - ms-mascotas
      - ms-geolocalizacion
      - kafka
    restart: unless-stopped

  gateway-sanosysalvos:
    build: ./gateway-sanosysalvos
    environment:
      MS_USUARIOS_URL: "http://ms-usuarios:8081"
      MS_MASCOTAS_URL: "http://ms-mascotas:8082"
      MS_COINCIDENCIAS_URL: "http://ms-coincidencias:8083"
      MS_GEOLOCALIZACION_URL: "http://ms-geolocalizacion:8084"
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
    ports:
      - "8080:8080"
    depends_on:
      - ms-usuarios
      - ms-mascotas
      - ms-coincidencias
      - ms-geolocalizacion
    restart: unless-stopped

volumes:
  rabbitmq_data:
  zookeeper_data:
  zookeeper_log:
  kafka_data: