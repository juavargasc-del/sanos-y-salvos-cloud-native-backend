version: '3.8'

services:
  sonarqube-db:
    image: postgres:15-alpine
    container_name: sonarqube-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonarqube
    ports:
      - "5432:5432"
    volumes:
      - sonarqube-db-data:/var/lib/postgresql/data
    networks:
      - sanosysalvos-network

  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube
    depends_on:
      - sonarqube-db
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    networks:
      - sanosysalvos-network

  mysql:
    image: mysql:8.0
    container_name: sanosysalvos-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: sanosysalvos_usuarios
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - sanosysalvos-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.2-management
    container_name: sanosysalvos-rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - sanosysalvos-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5      

  ms-usuarios:
    build:
      context: ./ms-usuarios
    container_name: ms-usuarios
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sanosysalvos-network
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/sanosysalvos_usuarios?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"

  ms-mascotas:
    build:
      context: ./ms-mascotas
    container_name: ms-mascotas
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sanosysalvos-network
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/sanosysalvos_mascotas?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      MASCOTAS_RABBITMQ_SIMULATE_PROCESSING_ERROR: "${MASCOTAS_RABBITMQ_SIMULATE_PROCESSING_ERROR:-false}"

  ms-rabbitmq-admin:
    build:
      context: ./ms-rabbitmq-admin
    container_name: ms-rabbitmq-admin
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - sanosysalvos-network
    environment:
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      RABBITMQ_MANAGEMENT_BASE_URL: http://rabbitmq:15672
      SPRING_PROFILES_ACTIVE: local-test
      RABBITMQ_ADMIN_LOCAL_USERNAME: "${RABBITMQ_ADMIN_LOCAL_USERNAME:-rabbitmq-admin-local}"
      RABBITMQ_ADMIN_LOCAL_PASSWORD: "${RABBITMQ_ADMIN_LOCAL_PASSWORD:?Set RABBITMQ_ADMIN_LOCAL_PASSWORD before starting ms-rabbitmq-admin}"

  ms-coincidencias:
    build:
      context: ./ms-coincidencias
    container_name: ms-coincidencias
    ports:
      - "8083:8083"
    depends_on:
      - ms-mascotas
      - ms-geolocalizacion
    networks:
      - sanosysalvos-network
    environment:
      MS_MASCOTAS_URL: http://ms-mascotas:8082
      MS_GEOLOCALIZACION_URL: http://ms-geolocalizacion:8084
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"

  ms-geolocalizacion:
    build:
      context: ./ms-geolocalizacion
    container_name: ms-geolocalizacion
    ports:
      - "8084:8084"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sanosysalvos-network
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/sanosysalvos_geolocalizacion?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"

  gateway-sanosysalvos:
    build:
      context: ./gateway-sanosysalvos
    container_name: gateway-sanosysalvos
    ports:
      - "8080:8080"
    depends_on:
      - ms-usuarios
      - ms-mascotas
      - ms-coincidencias
      - ms-geolocalizacion
    networks:
      - sanosysalvos-network
    environment:
      MS_MASCOTAS_URL: http://ms-mascotas:8082
      MS_USUARIOS_URL: http://ms-usuarios:8081
      MS_COINCIDENCIAS_URL: http://ms-coincidencias:8083
      MS_GEOLOCALIZACION_URL: http://ms-geolocalizacion:8084

networks:
  sanosysalvos-network:
    driver: bridge

volumes:
  mysql-data:
  sonarqube-db-data:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
  rabbitmq-data: