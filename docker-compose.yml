version: '3.8'

services:
  sonarqube-db:
    image: postgres:15-alpine
    container_name: sonarqube-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonarqube
    ports:
      - "5432:5432"
    volumes:
      - sonarqube-db-data:/var/lib/postgresql/data
    networks:
      - sanosysalvos-network

  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube
    depends_on:
      - sonarqube-db
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    networks:
      - sanosysalvos-network

  mysql:
    image: mysql:8.0
    container_name: sanosysalvos-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: sanosysalvos_usuarios
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - sanosysalvos-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.2-management
    container_name: sanosysalvos-rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - sanosysalvos-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5      

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: sanosysalvos-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    expose:
      - "2181"
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    networks:
      - sanosysalvos-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: sanosysalvos-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - sanosysalvos-network

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: sanosysalvos-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8092:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: sanosysalvos-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - sanosysalvos-network

  ms-usuarios:
    build:
      context: ./ms-usuarios
    container_name: sanosysalvos-cloud-ms-usuarios
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sanosysalvos-network
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/sanosysalvos_usuarios?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"

  ms-mascotas:
    build:
      context: ./ms-mascotas
    container_name: sanosysalvos-cloud-ms-mascotas
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - sanosysalvos-network
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/sanosysalvos_mascotas?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  ms-coincidencias:
    build:
      context: ./ms-coincidencias
    container_name: sanosysalvos-cloud-ms-coincidencias
    ports:
      - "8083:8083"
    depends_on:
      - ms-mascotas
      - ms-geolocalizacion
      - kafka
    networks:
      - sanosysalvos-network
    environment:
      MS_MASCOTAS_URL: http://ms-mascotas:8082
      MS_GEOLOCALIZACION_URL: http://ms-geolocalizacion:8084
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  ms-geolocalizacion:
    build:
      context: ./ms-geolocalizacion
    container_name: sanosysalvos-cloud-ms-geolocalizacion
    ports:
      - "8084:8084"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - sanosysalvos-network
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/sanosysalvos_geolocalizacion?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"

  gateway-sanosysalvos:
    build:
      context: ./gateway-sanosysalvos
    container_name: sanosysalvos-cloud-gateway
    ports:
      - "8080:8080"
    depends_on:
      - ms-usuarios
      - ms-mascotas
      - ms-coincidencias
      - ms-geolocalizacion
    networks:
      - sanosysalvos-network
    environment:
      MS_MASCOTAS_URL: http://ms-mascotas:8082
      MS_USUARIOS_URL: http://ms-usuarios:8081
      MS_COINCIDENCIAS_URL: http://ms-coincidencias:8083
      MS_GEOLOCALIZACION_URL: http://ms-geolocalizacion:8084

networks:
  sanosysalvos-network:
    driver: bridge

volumes:
  mysql-data:
  sonarqube-db-data:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
  rabbitmq-data:
  zookeeper-data:
  zookeeper-log:
  kafka-data: