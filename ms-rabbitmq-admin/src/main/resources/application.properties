spring.application.name=ms-rabbitmq-admin
server.port=8090

spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

spring.rabbitmq.management.base-url=${RABBITMQ_MANAGEMENT_BASE_URL:http://rabbitmq:15672}
spring.rabbitmq.management.username=${RABBITMQ_USER:guest}
spring.rabbitmq.management.password=${RABBITMQ_PASSWORD:guest}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${ENTRA_ISSUER_URI:https://sts.windows.net/14cc35b0-80bc-4ffd-b90a-1fc02097a113/}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${ENTRA_JWK_SET_URI:https://login.microsoftonline.com/14cc35b0-80bc-4ffd-b90a-1fc02097a113/discovery/keys}
entra.security.audience=${ENTRA_AUDIENCE:api://d88e02e7-1a2d-4d8c-b8f8-ad917d8adeac}
rabbitmq.admin.authority=${RABBITMQ_ADMIN_AUTHORITY:ROLE_RABBITMQ_ADMIN}
